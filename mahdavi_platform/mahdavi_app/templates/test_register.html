{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="card" style="max-width: 500px; margin: 30px auto;">
        <div class="auth-header text-center">
            <h2>تست ثبت نام</h2>
        </div>

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label>نام:</label>
                <input type="text" name="first_name" class="form-control" value="تست" required>
            </div>
            
            <div class="form-group">
                <label>نام خانوادگی:</label>
                <input type="text" name="last_name" class="form-control" value="کاربر" required>
            </div>
            
            <div class="form-group">
                <label>شماره موبایل:</label>
                <input type="text" name="phone" class="form-control" value="09123456789" required>
            </div>
            
            <div class="form-group">
                <label>ایمیل:</label>
                <input type="email" name="email" class="form-control" value="test@example.com" required>
            </div>
            
            <div class="form-group">
                <label>سن:</label>
                <input type="number" name="age" class="form-control" value="25" required>
            </div>
            
            <div class="form-group">
                <label>رمز عبور:</label>
                <input type="password" name="password" class="form-control" value="1234" required>
            </div>
            
            <div class="form-group">
                <label>تکرار رمز عبور:</label>
                <input type="password" name="password2" class="form-control" value="1234" required>
            </div>
            
            <button type="submit" class="btn btn-primary">ثبت نام تست</button>
        </form>
    </div>
</div>
{% endblock %}
