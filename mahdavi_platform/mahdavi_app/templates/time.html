{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<style>
    /* استایل‌های اختصاصی صفحه اوقات شرعی */
    .city-selector {
        background-color: rgba(255, 255, 255, 0.15);
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 30px;
        border: 1px solid var(--border-gold);
    }
    
    .form-group {
        margin-bottom: 15px;
    }
    
    .form-label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: var(--gold);
    }
    
    select, button {
        width: 100%;
        padding: 12px 15px;
        border-radius: 8px;
        border: none;
        font-size: 1rem;
        background-color: rgba(255, 255, 255, 0.9);
    }
    
    .prayer-btn {
        background: linear-gradient(to right, var(--gold), var(--dark-gold));
        color: #333;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    
    .prayer-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
    }
    
    /* نمایش اوقات شرعی */
    .prayer-times {
        display: none;
        background-color: rgba(255, 255, 255, 0.15);
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
        border: 1px solid var(--border-gold);
    }
    
    .prayer-header {
        text-align: center;
        margin-bottom: 20px;
        color: var(--gold);
        font-family: 'Lateef', serif;
        font-size: 1.5rem;
    }
    
    .date-info {
        text-align: center;
        margin-bottom: 15px;
        font-size: 1.1rem;
        color: var(--gold);
        font-family: 'Lateef', serif;
    }
    
    .prayer-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
    }
    
    .prayer-item {
        background-color: rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        transition: all 0.3s ease;
        border: 1px solid var(--border-gold);
    }
    
    .prayer-item:hover {
        transform: translateY(-5px);
        background-color: rgba(255, 255, 255, 0.2);
    }
    
    .prayer-name {
        font-weight: bold;
        margin-bottom: 8px;
        color: var(--gold);
        font-family: 'Lateef', serif;
    }
    
    .prayer-time {
        font-size: 1.2rem;
        font-weight: bold;
        font-family: 'Lateef', serif;
    }
    
    /* انیمیشن لودینگ */
    .loading {
        display: none;
        text-align: center;
        margin: 20px 0;
    }
    
    .spinner {
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 5px solid var(--gold);
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    /* پیام خطا */
    .error-message {
        display: none;
        background-color: rgba(255, 0, 0, 0.2);
        color: #ff6b6b;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        margin-top: 20px;
        border: 1px solid rgba(255, 0, 0, 0.3);
    }
    
    .success-message {
        display: none;
        background-color: rgba(0, 255, 0, 0.2);
        color: #6bff6b;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        margin-top: 20px;
        border: 1px solid rgba(0, 255, 0, 0.3);
    }
    
    /* واکنشگرا */
    @media (max-width: 600px) {
        .prayer-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>
{% endblock %}

{% block content %}

<div class="card">
    <div class="card-header">
        <h2 class="card-title">
            <i class="fas fa-clock card-icon"></i>
            انتخاب شهر
        </h2>
    </div>
    
    <div class="city-selector">
        <div class="form-group">
            <label for="province" class="form-label">استان:</label>
            <select id="province" class="form-control">
                <option value="">لطفا استان انتخاب کنید</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="city" class="form-label">شهر:</label>
            <select id="city" class="form-control">
                <option value="">ابتدا استان را انتخاب کنید</option>
            </select>
        </div>
        
        <button id="get-times" class="prayer-btn">
            <i class="fas fa-search"></i> دریافت اوقات شرعی
        </button>
    </div>
    
    <div class="loading">
        <div class="spinner"></div>
        <p>در حال دریافت اطلاعات...</p>
    </div>
    
    <div class="error-message" id="error-message">
        خطا در دریافت اطلاعات. لطفا دوباره تلاش کنید.
    </div>
    
    <div class="success-message" id="success-message">
        اطلاعات با موفقیت دریافت شد.
    </div>
</div>

<div class="card prayer-times" id="prayer-times">
    <div class="card-header">
        <h2 class="card-title">
            <i class="fas fa-praying-hands card-icon"></i>
            <span id="prayer-header">اوقات شرعی</span>
        </h2>
    </div>
    
    <div class="date-info" id="date-info"></div>
    <div class="prayer-grid" id="prayer-grid">
        <!-- اوقات شرعی در اینجا نمایش داده می‌شود -->
    </div>
</div>
{% endblock %}

        // پر کردن لیست استان‌ها
        Object.keys(iranCities).forEach(province => {
            const option = document.createElement('option');
            option.value = province;
            option.textContent = province;
            provinceSelect.appendChild(option);
        });
        
        // هنگام تغییر استان، شهرهای آن استان را بارگذاری کن
        provinceSelect.addEventListener('change', function() {
            const selectedProvince = this.value;
            citySelect.innerHTML = '<option value="">لطفا شهر انتخاب کنید</option>';
            
            if (selectedProvince && iranCities[selectedProvince]) {
                iranCities[selectedProvince].forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                });
            }
        });
        
        // دریافت اوقات شرعی
        getTimesBtn.addEventListener('click', function() {
            const city = citySelect.value;
            const province = provinceSelect.value;
            
            if (!city || !province) {
                showError('لطفا استان و شهر خود را انتخاب کنید.');
                return;
            }
            
            getPrayerTimes(city, province);
        });
        
        // تابع دریافت اوقات شرعی از API
        async function getPrayerTimes(city, province) {
            showLoading();
            hideError();
            hideSuccess();
            
            try {
                // استفاده از API عمومی برای دریافت اوقات شرعی
                const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=Iran&method=7`);
                
                if (!response.ok) {
                    throw new Error('خطا در دریافت اطلاعات');
                }
                
                const data = await response.json();
                
                if (data.code === 200) {
                    displayPrayerTimes(data.data, city, province);
                    showSuccess();
                } else {
                    throw new Error('اطلاعات دریافت نشد');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('خطا در دریافت اطلاعات اوقات شرعی. لطفا دوباره تلاش کنید.');
                
                // نمایش داده‌های نمونه در صورت خطا
                displaySamplePrayerTimes(city, province);
            } finally {
                hideLoading();
            }
        }
        
        // نمایش اوقات شرعی
        function displayPrayerTimes(data, city, province) {
            const timings = data.timings;
            const date = data.date;
            
            prayerHeader.textContent = `اوقات شرعی ${city} - ${province}`;
            dateInfo.textContent = `${date.hijri.weekday.fa} ${date.hijri.day} ${date.hijri.month.fa} ${date.hijri.year} - ${date.gregorian.weekday.fa} ${date.gregorian.day} ${date.gregorian.month.fa} ${date.gregorian.year}`;
            
            prayerGrid.innerHTML = '';
            
            // اوقات شرعی اصلی - اصلاح شده برای نمایش اذان مغرب
            const mainPrayers = {
                "اذان صبح": timings.Fajr,
                "طلوع آفتاب": timings.Sunrise,
                "اذان ظهر": timings.Dhuhr,
                "غروب آفتاب": timings.Sunset,
                "اذان مغرب": timings.Maghrib, // اینجا اصلاح شد
                "عشاء": timings.Isha,
                "نیمه شب شرعی": timings.Midnight
            };
            
            Object.keys(mainPrayers).forEach(prayer => {
                const prayerItem = document.createElement('div');
                prayerItem.className = 'prayer-item';
                
                const prayerName = document.createElement('div');
                prayerName.className = 'prayer-name';
                prayerName.textContent = prayer;
                
                const prayerTime = document.createElement('div');
                prayerTime.className = 'prayer-time';
                prayerTime.textContent = mainPrayers[prayer];
                
                prayerItem.appendChild(prayerName);
                prayerItem.appendChild(prayerTime);
                prayerGrid.appendChild(prayerItem);
            });
            
            prayerTimesSection.style.display = 'block';
        }
        
        // نمایش داده‌های نمونه در صورت عدم دسترسی به API
        function displaySamplePrayerTimes(city, province) {
            // داده‌های نمونه برای اوقات شرعی
            const sampleTimes = {
                "اذان صبح": "04:45",
                "طلوع آفتاب": "06:15",
                "اذان ظهر": "12:45",
                "غروب آفتاب": "19:15",
                "اذان مغرب": "19:35",
                "عشاء": "20:15",
                "نیمه شب شرعی": "23:45"
            };
            
            prayerHeader.textContent = `اوقات شرعی ${city} - ${province} (نمونه)`;
            dateInfo.textContent = `پنجشنبه ۱۵ شهریور ۱۴۰۳ - ۲۷ صفر ۱۴۴۵`;
            
            prayerGrid.innerHTML = '';
            
            Object.keys(sampleTimes).forEach(prayer => {
                const prayerItem = document.createElement('div');
                prayerItem.className = 'prayer-item';
                
                const prayerName = document.createElement('div');
                prayerName.className = 'prayer-name';
                prayerName.textContent = prayer;
                
                const prayerTime = document.createElement('div');
                prayerTime.className = 'prayer-time';
                prayerTime.textContent = sampleTimes[prayer];
                
                prayerItem.appendChild(prayerName);
                prayerItem.appendChild(prayerTime);
                prayerGrid.appendChild(prayerItem);
            });
            
            prayerTimesSection.style.display = 'block';
            showSuccess('اطلاعات نمونه نمایش داده می‌شود (API در دسترس نیست)');
        }
        
        // توابع کمکی برای نمایش/پنهان کردن عناصر
        function showLoading() {
            loading.style.display = 'block';
        }
        
        function hideLoading() {
            loading.style.display = 'none';
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
        
        function hideError() {
            errorMessage.style.display = 'none';
        }
        
        function showSuccess(message) {
            if (message) successMessage.textContent = message;
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        }
        
        function hideSuccess() {
            successMessage.style.display = 'none';
        }
        
        // بارگذاری خودکار اوقات شرعی برای تهران
        window.onload = function() {
            provinceSelect.value = "تهران";
            provinceSelect.dispatchEvent(new Event('change'));
            setTimeout(() => {
                citySelect.value = "تهران";
                getPrayerTimes("تهران", "تهران");
            }, 500);
        };
    });
</script>
{% endblock %}
